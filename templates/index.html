<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AI Faceless Video Generator</title>
</head>
<body>
    <h1>AI Faceless Video Generator</h1>
    <form action="/generate-form" method="post">
        <textarea name="script" rows="10" cols="80" placeholder="Enter your script here"></textarea><br>
        <button type="submit">Generate Video</button>
    </form>
    {% if output %}
    <h2>Video generated:</h2>
    <a href="{{ output }}">{{ output }}</a>
    {% endif %}
</body>
</html>
