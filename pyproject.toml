[project]
name = "ai-faceless-yt"
version = "0.1.0"
description = "Faceless AI-powered YouTube video generation pipeline"
authors = [{ name="Connor ODea", email="connor@example.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "moviepy>=1.0.3",
  "requests>=2.31.0",
  "tqdm>=4.66.2",
  "python-dotenv>=1.0.1",
  "elevenlabs>=0.2.26",
  "openai>=1.14.3",
  "pyyaml>=6.0.1",
  "pydub>=0.25.1",
  "rich>=13.7.0",
  "anthropic>=0.7.7",
  "deepgram-sdk>=2.13.0",
  "ffmpeg-python>=0.2.0"
]
urls = {
  "Homepage" = "https://github.com/connorodea/ai-faceless-yt",
  "Documentation" = "https://github.com/connorodea/ai-faceless-yt#readme",
  "Source" = "https://github.com/connorodea/ai-faceless-yt",
  "Tracker" = "https://github.com/connorodea/ai-faceless-yt/issues"
}

[project.optional-dependencies]
dev = [
  "pytest>=7.4.4",
  "flake8>=7.0.0",
  "black>=24.3.0",
  "mypy>=1.9.0"
]

[project.scripts]
ai-faceless-yt = "ai_faceless.generator:run_pipeline"

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
ai-faceless-yt = "ai_faceless.generator:run_pipeline"

[tool.setuptools.packages.find]
where = ["ai_faceless"]